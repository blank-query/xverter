name: release

# The whole release: standalone one-file executables (double-click and
# the program opens), platform wheels, sdist, and the PyPI upload.
#
# One workflow rather than two so the PyPI job can depend on the binaries
# actually building. PyPI is the only step that cannot be undone - a
# version number can be yanked but never re-uploaded - so it runs last,
# and never from a manual dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: xverter.exe
            binary: dist/xverter.exe
            strip: ""              # python314.dll ships stripped already
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7zr.exe
            sz_addbinary: "szbin/7zr.exe;." 
          - os: ubuntu-22.04     # oldest runner glibc = widest compatibility
            artifact: xverter-linux-x86_64
            binary: dist/xverter
            strip: "--strip"       # setup-python's Linux CPython carries full
                                   # DWARF: libpython alone is 32.9 MB unstripped
                                   # vs 6.1 MB stripped. Worth ~18 MB per binary.
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
            sz_addbinary: "szbin/7zz:." 
          - os: macos-latest
            artifact: xverter-macos-arm64
            binary: dist/xverter
            strip: ""              # Python.framework already stripped; strip
                                   # also perturbs arm64 code signatures
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-mac.tar.xz
            sz_addbinary: "szbin/7zz:." 
          - os: ubuntu-22.04-arm
            artifact: xverter-linux-arm64
            binary: dist/xverter
            strip: "--strip"
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-arm64.tar.xz
            sz_addbinary: "szbin/7zz:." 
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Free-threaded. We choose the interpreter for the standalone
          # binaries, and this is the one measurement says to choose:
          # 2 KB LZ4-HC blocks and 4 KiB SHA-1 blocks only parallelise
          # without a GIL, and the code sizes its pools from
          # Py_GIL_DISABLED. Frozen binary, real conversion of a 7.8 GB
          # redump including verification: 24-25s built on 3.14,
          # 17s built on 3.14t, byte-identical output either way.
          python-version: "3.14t"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `.[tui]` was a no-op: textual is a hard dependency and the
          # only extra is `security`, so pip warned and moved on, and
          # every shipped binary fell back to stdlib XML for DAT
          # parsing. Ask for the extra that exists.
          python -m pip install ".[security]" pyinstaller
      - name: Fetch the 7-Zip engine (official, multithreaded)
        shell: bash
        env:
          SZ_URL: ${{ matrix.sz_url }}
        run: |
          mkdir szbin && cd szbin
          curl -sSfL -o pkg "$SZ_URL"
          case "$SZ_URL" in
            *.tar.xz) tar xJf pkg 7zz && rm pkg ;;
            *7zr.exe) mv pkg 7zr.exe ;;
          esac
          ls -la
      - name: Build one-file binary
        run: >
          pyinstaller --onefile --name xverter ${{ matrix.strip }}
          --collect-all textual
          --add-data "xverter/data:xverter/data"
          --add-binary "${{ matrix.sz_addbinary }}"
          --hidden-import xverter.tui
          launcher.py
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} info xverter || true
          # A --version check does not prove a frozen build works, and
          # this one also has to prove the interpreter is the one we
          # asked for - a silent fall back to a GIL build would cost
          # ~1.45x and nothing would fail.
          ${{ matrix.binary }} --version | grep -q free-threaded \
            || { echo "BUILT AGAINST A GIL INTERPRETER - refusing"; exit 1; }
      - name: Rename artifact
        if: runner.os != 'Windows'
        run: mv ${{ matrix.binary }} dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: gh release upload --clobber "$TAG" "dist/${{ matrix.artifact }}"

  # ---------------------------------------------------------------- PyPI
  # Platform wheels each carry the official 7-Zip engine inside
  # xverter/bin; the sdist ships engine-free (runtime falls back to a
  # system 7-Zip with a hint).
  wheels:
    strategy:
      matrix:
        include:
          - os: windows-latest
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7zr.exe
            plat: win_amd64
          - os: ubuntu-22.04
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
            plat: manylinux_2_17_x86_64
          - os: ubuntu-22.04-arm
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-arm64.tar.xz
            plat: manylinux_2_17_aarch64
          - os: macos-latest
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-mac.tar.xz
            plat: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Embed the 7-Zip engine
        shell: bash
        env:
          SZ_URL: ${{ matrix.sz_url }}
        run: |
          mkdir -p xverter/bin && cd xverter/bin
          curl -sSfL -o pkg "$SZ_URL"
          case "$SZ_URL" in
            *.tar.xz) tar xJf pkg 7zz && rm pkg && chmod +x 7zz ;;
            *7zr.exe) mv pkg 7zr.exe ;;
          esac
      - name: Build and platform-tag wheel
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel
          python -m wheel tags --platform-tag ${{ matrix.plat }} --remove dist/*.whl
          ls dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sdist (engine-free)
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # THE GATE: PyPI is the one irreversible step - a version number, once
    # uploaded, can be yanked but never replaced. So it goes last and only
    # after every standalone binary has built AND smoke-tested.
    needs: [build, wheels, sdist]
    # Never publish from a manual dispatch: that would ship whatever is on
    # the branch, untagged and unreleased. Releases only.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Select by name - this workflow also produces the standalone
      # binaries, and an unfiltered download would stage them for upload.
      - name: Collect wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: Collect sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: sdist
      - name: Refuse to publish anything that is not a wheel or sdist
        shell: bash
        run: |
          ls -la dist/
          stray=$(find dist -type f ! -name '*.whl' ! -name '*.tar.gz')
          if [ -n "$stray" ]; then
            echo "refusing to publish; unexpected files staged:"
            echo "$stray"
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
