name: publish-pypi

# Publishes to PyPI via Trusted Publishing (OIDC). Platform wheels each
# carry the official 7-Zip engine inside xverter/bin; the sdist ships
# engine-free (runtime falls back to a system 7-Zip with a hint).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - os: windows-latest
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7zr.exe
            plat: win_amd64
          - os: ubuntu-22.04
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
            plat: manylinux_2_17_x86_64
          - os: ubuntu-22.04-arm
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-arm64.tar.xz
            plat: manylinux_2_17_aarch64
          - os: macos-latest
            sz_url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-mac.tar.xz
            plat: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Embed the 7-Zip engine
        shell: bash
        env:
          SZ_URL: ${{ matrix.sz_url }}
        run: |
          mkdir -p xverter/bin && cd xverter/bin
          curl -sSfL -o pkg "$SZ_URL"
          case "$SZ_URL" in
            *.tar.xz) tar xJf pkg 7zz && rm pkg && chmod +x 7zz ;;
            *7zr.exe) mv pkg 7zr.exe ;;
          esac
      - name: Build and platform-tag wheel
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel
          python -m wheel tags --platform-tag ${{ matrix.plat }} --remove dist/*.whl
          ls dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sdist (engine-free)
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
